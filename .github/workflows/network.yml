name: Network validation
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build the Release container
        run: docker build -t cpp-sim .
      - name: Report host and toolchain
        run: |
          lscpu
          uname -r
          docker run --rm cpp-sim tc -V
      - name: Measure baseline and impaired loopback
        run: |
          set -euo pipefail
          docker run --rm cpp-sim python3 /opt/sim/measure.py /usr/local/bin/sim_server /usr/local/bin/sim_load | tee baseline.txt
          docker run --rm --cap-add NET_ADMIN cpp-sim sh -c 'tc qdisc add dev lo root netem delay 40ms 10ms loss 2% && tc qdisc show dev lo && exec python3 /opt/sim/measure.py /usr/local/bin/sim_server /usr/local/bin/sim_load' | tee netem.txt
      - name: Save results
        uses: actions/upload-artifact@v4
        with:
          name: network-measurements
          path: |
            baseline.txt
            netem.txt
